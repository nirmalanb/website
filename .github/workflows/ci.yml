name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck + Astro diagnostics
        run: pnpm check

      - name: JWT tool crypto + DOM tests
        run: pnpm test

      - name: Build (also enforces the page script budget)
        run: pnpm build
